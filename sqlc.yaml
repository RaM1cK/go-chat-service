version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/pgsql"
    queries: "sql/queries"
    gen:
      go:
        package: "pgsql"
        out: "internal/db/pgsql"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
